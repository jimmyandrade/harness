name: release-please

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-26.04
    steps:
      - name: Open or update the release pull request
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # A pull request that GITHUB_TOKEN opens or updates gets its pull_request
      # runs held until someone with write access approves them. A
      # workflow_dispatch runs at once, so the required test check runs on it.
      - name: Run CI on the release pull request
        # Without a release pull request, `pr` is empty. The branch is read in the
        # script: the job failed when fromJSON in the env got an empty `pr`.
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(jq -r .headBranchName <<<"$PR")
          if [ -z "$branch" ] || [ "$branch" = null ]; then
            echo "::error::The release pull request output has no headBranchName: $PR"
            exit 1
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
