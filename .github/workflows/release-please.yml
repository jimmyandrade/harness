name: release-please

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-26.04
    steps:
      # GitHub holds the pull_request runs of a pull request that GITHUB_TOKEN
      # opens or updates until someone approves them. A pull request the app
      # opens runs ci.yml at once, so the required test check runs on it.
      - name: Create a token for the release app
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Open or update the release pull request
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
