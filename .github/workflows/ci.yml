name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the branch name
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          case "$BRANCH" in renovate/*|dependabot/*|release-please--*) exit 0 ;; esac
          [[ "$BRANCH" =~ ^(feat|fix|docs|refactor|perf|test|chore|ci)/[a-z0-9]+([.-][a-z0-9]+)*$ ]] || { echo "::error title=Branch name::$BRANCH is not type/short-description. Rename it before the first push."; exit 1; }
      - name: Decide whether the change is only documentation
        id: scope
        run: .github/scripts/change-scope.sh "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Check skills
        if: steps.scope.outputs.code == 'true'
        uses: ./.github/actions/check-skill
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Run script tests
        if: steps.scope.outputs.code == 'true'
        run: for test in .agents/scripts/*/test_*.py .agents/skills/*/scripts/test_*.py; do .venv/bin/python "$test" || exit 1; done
      - name: Set up Node.js
        if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: steps.scope.outputs.code == 'true'
        run: npm ci
      - name: Check types
        if: steps.scope.outputs.code == 'true'
        run: npx tsc --noEmit
      - name: Run unit tests
        if: steps.scope.outputs.code == 'true'
        run: npm test
