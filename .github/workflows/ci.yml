name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Check the branch name
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          case "$BRANCH" in renovate/*|dependabot/*|release-please--*) exit 0 ;; esac
          [[ "$BRANCH" =~ ^(feat|fix|docs|refactor|perf|test|chore|ci)/[a-z0-9]+([.-][a-z0-9]+)*$ ]] || { echo "::error title=Branch name::$BRANCH is not type/short-description. Rename it before the first push."; exit 1; }
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npx tsc --noEmit
      - name: Run unit tests
        run: npm test
