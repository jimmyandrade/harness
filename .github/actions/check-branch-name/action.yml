name: Check the branch name
description: Fail a pull request whose branch is not type/short-description, with a message for a coding agent when the branch has the prefix of its tool.
inputs:
  types:
    description: Accepted branch types, separated by spaces or commas. Empty keeps feat fix docs refactor perf test chore ci.
    required: false
    default: ""
  blocked-prefixes:
    description: Coding agent prefixes that get the message for the agent, separated by spaces or commas. Empty keeps claude codex copilot cursor.
    required: false
    default: ""
  allowed-prefixes:
    description: Branch prefixes that pass without the check, such as the ones that dependency and release bots create, separated by spaces or commas. Empty keeps renovate/ dependabot/ release-please--.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Check the branch against the accepted types
      shell: bash
      env:
        BRANCH: ${{ github.head_ref }}
        BRANCH_TYPES: ${{ inputs.types }}
        BLOCKED_BRANCH_PREFIXES: ${{ inputs.blocked-prefixes }}
        ALLOWED_BRANCH_PREFIXES: ${{ inputs.allowed-prefixes }}
      run: '"$GITHUB_ACTION_PATH/../../scripts/branch-name.sh" "$BRANCH"'
