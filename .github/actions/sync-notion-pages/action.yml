name: Sync Notion pages
description: Create or update one Notion page per changed skill of the calling repository, with that repository's mapping, the page of its project instructions when they change, and one page per changed model when the repository has a model mapping.
inputs:
  notion-token:
    description: Notion integration token with access to the skills data source.
    required: true
  skills-data-source-id:
    description: Data source id of the skills database, from the NOTION_SKILLS_DATA_SOURCE_ID secret. A data_source_id still in the mapping works with a warning to migrate; both at once fail.
    required: false
    default: ""
  templates-data-source-id:
    description: Data source id of the models database, from the NOTION_TEMPLATES_DATA_SOURCE_ID secret, when the repository publishes models. Same rule as skills-data-source-id.
    required: false
    default: ""
  base:
    description: Commit the change starts from.
    required: true
  head:
    description: Commit the change ends at.
    required: false
    default: ${{ github.sha }}
  mapping:
    description: Mapping file in the calling repository.
    required: false
    default: .agents/mappings/skill-page.notion.json
  template-mapping:
    description: Model mapping file in the calling repository. Without that file, models are not published.
    required: false
    default: .agents/mappings/template-page.notion.json
  include-core:
    description: Also publish the skills and models of this harness when the caller moves its version or its mapping.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Check the Notion token
      shell: bash
      env:
        NOTION_TOKEN: ${{ inputs.notion-token }}
      run: |
        if [ -z "$NOTION_TOKEN" ]; then
          echo "::error title=NOTION_TOKEN is missing::The notion-token input is empty. Add the NOTION_TOKEN repository secret, from a Notion integration with access to the skills database, as in docs/runbooks/notion.md of jimmyandrade/harness."
          exit 1
        fi
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        check-latest: true
    - name: Install the sync dependencies
      shell: bash
      run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH/../../.."
    - name: Publish changed skills and models to Notion
      shell: bash
      env:
        HARNESS_ROOT: ${{ github.workspace }}
        NOTION_TOKEN: ${{ inputs.notion-token }}
        NOTION_SKILLS_DATA_SOURCE_ID: ${{ inputs.skills-data-source-id }}
        NOTION_TEMPLATES_DATA_SOURCE_ID: ${{ inputs.templates-data-source-id }}
      run: >-
        node "$GITHUB_ACTION_PATH/../../../.agents/scripts/sync-notion-pages/sync-notion-pages.ts"
        --base "${{ inputs.base }}"
        --head "${{ inputs.head }}"
        --mapping "${{ inputs.mapping }}"
        --template-mapping "${{ inputs.template-mapping }}"
        ${{ inputs.include-core == 'true' && '--include-core' || '' }}
