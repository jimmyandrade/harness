name: Sync skill pages
description: Create or update one Notion page per changed skill of the calling repository, with that repository's mapping.
inputs:
  notion-token:
    description: Notion integration token with access to the skills data source.
    required: true
  base:
    description: Commit the change starts from.
    required: true
  head:
    description: Commit the change ends at.
    required: false
    default: ${{ github.sha }}
  mapping:
    description: Mapping file in the calling repository.
    required: false
    default: .agents/mappings/skill-page.notion.json
  include-core:
    description: Also publish the skills of this harness when the caller moves its version or its mapping.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Install the sync dependencies
      shell: bash
      run: npm ci --omit=dev --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH/../../.."
    - name: Publish changed skills to Notion
      shell: bash
      env:
        HARNESS_ROOT: ${{ github.workspace }}
        NOTION_TOKEN: ${{ inputs.notion-token }}
      run: >-
        node "$GITHUB_ACTION_PATH/../../../.agents/scripts/sync-skill-pages/sync-skill-pages.ts"
        --base "${{ inputs.base }}"
        --head "${{ inputs.head }}"
        --mapping "${{ inputs.mapping }}"
        ${{ inputs.include-core == 'true' && '--include-core' || '' }}
