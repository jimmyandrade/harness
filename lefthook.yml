# Lefthook runs the skill checker on commit.
# `**` matches one or more directories, so skills live at .agents/skills/<name>/SKILL.md.
# On macOS, skill-folder-icon writes the "Símbolo da pasta no macOS" parameter onto each skill folder,
# with the Python of the harness virtual environment.

pre-commit:
  commands:
    skill-check:
      glob:
        - ".agents/skills/**/SKILL.md"
        - "AGENTS.md"
        - ".agents/assets/templates/*.md"
        - ".agents/scripts/**"
        - ".claude-plugin/*.json"
        - ".cursor-plugin/*.json"
      run: .agents/scripts/check-skill/run-check.sh {staged_files}
    skill-folder-icon:
      run: .agents/scripts/skill-folder-icon/run-folder-icon.sh

post-checkout:
  commands:
    skill-folder-icon:
      run: .agents/scripts/skill-folder-icon/run-folder-icon.sh
