# Lefthook runs the skill checker on commit.
# `**` matches one or more directories, so skills live at .agents/skills/<name>/SKILL.md
# or at plugins/<plugin>/skills/<name>/SKILL.md.
# On macOS, skill-folder-icon writes the "Símbolo da pasta no macOS" parameter onto each skill folder,
# with the Python of the harness virtual environment.
# After a checkout or a merge that changed package-lock.json, reinstall-dependencies runs npm ci.

pre-commit:
  commands:
    skill-check:
      glob:
        - ".agents/skills/**/SKILL.md"
        - "plugins/*/skills/**/SKILL.md"
        - "AGENTS.md"
        - ".agents/assets/templates/*.md"
        - ".agents/scripts/**"
        - ".claude-plugin/*.json"
        - ".cursor-plugin/*.json"
      run: .agents/scripts/check-skill/run-check.sh {staged_files}
    skill-folder-icon:
      run: .agents/scripts/skill-folder-icon/run-folder-icon.sh

post-checkout:
  commands:
    reinstall-dependencies:
      run: .agents/scripts/reinstall-dependencies/reinstall-dependencies.sh post-checkout {1} {2} {3}
    skill-folder-icon:
      run: .agents/scripts/skill-folder-icon/run-folder-icon.sh

post-merge:
  commands:
    reinstall-dependencies:
      run: .agents/scripts/reinstall-dependencies/reinstall-dependencies.sh post-merge
