# Default settings for skills, commits, and scripts. Skill text does not read this file.
# A project that uses this harness keeps its own .agents/config.yml.
# A key missing there falls back to the value in this file.
locale:
  # Language of the skill name, description, and body.
  # When this value changes, rewrite every skill to match.
  # For ja, write the name in Hepburn romaji.
  skill: pt-BR
  # Language of commit subjects.
  commit_subject: en
organization:
  # Written as metadata.author on each skill.
  name: jimmyandrade
license:
  # While false, a skill must not set license. While true, license is required.
  required: false
limits:
  # Maximum size of a skill. The checker reads these keys.
  skill_words: 5000
  skill_lines: 500
  skill_catalog_tokens: 100
  skill_body_tokens: 5000
recognition:
  # Languages the image reader tries, first one first.
  # recognize.py reads this list. Use BCP 47 tags.
  languages:
    - pt-BR
    - en-US
notion:
  # Icon written on each skill page. The publisher reads these keys.
  # color is gray, lightgray, brown, yellow, orange, green, blue, purple, pink, or red.
  page_icon_name: magic-wand
  page_icon_color: gray
macos:
  # SF Symbol written on each skill folder. set-folder-icon.py reads this key.
  # Other systems skip it.
  folder_icon_symbol: wand.and.sparkles
mermaid:
  # Direction of every flowchart. The checker reads this key.
  # LR reads across the page. When this value changes, rewrite every flowchart.
  flowchart_direction: LR
