name: release-please

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-26.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Open or update the release pull request
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # A pull request opened with GITHUB_TOKEN fires no pull_request workflow,
      # but a workflow_dispatch does, so the checks run on the release pull request.
      # skills.yml is the CI workflow of examples/business-harness; name yours.
      - name: Run CI on the release pull request
        # Without a release pull request, `pr` is empty. The branch is read in the
        # script: the job failed when fromJSON in the env got an empty `pr`.
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(jq -r .headBranchName <<<"$PR")
          if [ -z "$branch" ] || [ "$branch" = null ]; then
            echo "::error::The release pull request output has no headBranchName: $PR"
            exit 1
          fi
          gh workflow run skills.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  # The release above does not fire `release` in other workflows, so this job
  # publishes the skills of the new release to Notion.
  sync-skills:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/sync-skills.yml
    with:
      head: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
