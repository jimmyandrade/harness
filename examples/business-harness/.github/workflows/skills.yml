name: skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - name: Check the branch name
        if: github.event_name == 'pull_request'
        uses: jimmyandrade/harness/.github/actions/check-branch-name@vX.Y.Z
        # with:
        #   types: feat fix docs refactor perf test chore ci build
        #   blocked-prefixes: claude codex copilot cursor devin
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check skills
        uses: jimmyandrade/harness/.github/actions/check-skill@vX.Y.Z
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
